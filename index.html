<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator +</title>

<style>
input, select {
  text-align: center;
}
  
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #f5f5f5;
  background: url('https://s3.us-west-1.amazonaws.com/media.pixelpad.io/__ASSET__.49871.1844522.1759809723.background.png')
    center/cover no-repeat fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
}

h1 {
  font-size: 34px;
  margin-bottom: 20px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
}

.container {
  position: relative;
  z-index: 1;
  background: rgba(20,20,20,0.85);
  border-radius: 16px;
  padding: 25px 40px;
  width: 480px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

input, select, button {
  margin: 8px 0;
  padding: 8px 10px;
  border: none;
  border-radius: 6px;
  font-size: 15px;
}

input, select {
  width: 95%;
  background: #2a2a2a;
  color: #f5f5f5;
}

button {
  background: #007bff;
  color: white;
  cursor: pointer;
  width: 100%;
  transition: transform 0.25s, background 0.25s;
}

button:hover {
  background: #005fcc;
  transform: scale(1.05);
}

hr {
  border: 1px solid #333;
  margin: 15px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 14px;
}

th, td {
  border: 1px solid #444;
  padding: 6px;
}

th {
  background: rgba(255,255,255,0.1);
}

#output {
  font-weight: bold;
  font-size: 18px;
}

#neededOutput {
  font-weight: bold;
  margin-top: 10px;
  min-height: 40px;
}

#targetDisplay {
  color: #007bff;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="overlay"></div>
<h1>Grade Calculator</h1>

<div class="container">
<h2>Grade Calculator +</h2>

<label>Formative Weight (%):</label>
<input type="number" id="percent1" value="20">

<label>Summative Weight (%):</label>
<input type="number" id="percent2" value="80">

<hr>

<label>Score:</label>
<input type="text" id="scoreInput" placeholder="e.g. 3/5">

<label>Type:</label>
<select id="scoreType">
  <option value="formative">Formative</option>
  <option value="summative">Summative</option>
</select>

<button id="addScore">Add Score</button>

<h3>Assignments</h3>
<table>
<thead>
<tr><th>Formative</th><th>Summative</th></tr>
</thead>
<tbody id="scoreTable"></tbody>
</table>

<button id="calculate">Calculate Final Grade</button>
<p id="output"></p>

<hr>

<h3>Grade Goal Calculator</h3>

<label>Target Grade: <span id="targetDisplay">90%</span></label>
<input type="range" id="targetSlider" min="0" max="100" value="90">

<label>Assignment Type:</label>
<select id="futureType">
  <option value="formative">Formative</option>
  <option value="summative">Summative</option>
</select>

<label>Points Possible:</label>
<input type="number" id="futurePoints" value="100">

<button id="calculateNeeded">Calculate Needed Score</button>
<p id="neededOutput"></p>
</div>

<script>
let percent1List = [];
let percent2List = [];

function calculateCurrentGrade(wF, wS) {
  let fE = 0, fT = 0, sE = 0, sT = 0;
  percent1List.forEach(([e,t]) => { fE += e; fT += t; });
  percent2List.forEach(([e,t]) => { sE += e; sT += t; });

  if (fT + sT === 0) return NaN;

  const F = fT ? fE / fT : 0;
  const S = sT ? sE / sT : 0;

  return F * wF + S * wS;
}

addScore.onclick = () => {
  const parts = scoreInput.value.split("/");
  if (parts.length !== 2) return alert("Use x/y format");

  const e = +parts[0], t = +parts[1];
  if (!t || isNaN(e)) return alert("Invalid numbers");

  const row = scoreTable.insertRow();
  row.insertCell(0).textContent = scoreType.value === "formative" ? `${e}/${t}` : "";
  row.insertCell(1).textContent = scoreType.value === "summative" ? `${e}/${t}` : "";

  (scoreType.value === "formative" ? percent1List : percent2List).push([e,t]);
  scoreInput.value = "";
};

calculate.onclick = () => {
  const wF = percent1.value / 100;
  const wS = percent2.value / 100;
  const g = calculateCurrentGrade(wF, wS);
  output.textContent = isNaN(g) ? "No scores yet!" : `Final Grade: ${(g*100).toFixed(2)}%`;
};

/* ===== TARGET CALCULATOR (WITH MAX POSSIBLE MESSAGE) ===== */
calculateNeeded.onclick = () => {
  const target = targetSlider.value / 100;
  const futurePts = +futurePoints.value;
  const wF = percent1.value / 100;
  const wS = percent2.value / 100;

  let fE=0,fT=0,sE=0,sT=0;
  percent1List.forEach(([e,t]) => { fE+=e; fT+=t; });
  percent2List.forEach(([e,t]) => { sE+=e; sT+=t; });

  if (fT + sT === 0) {
    neededOutput.textContent = "Add some scores first!";
    return;
  }

  const F = fT ? fE / fT : 0;
  const S = sT ? sE / sT : 0;

  let x;
  if (futureType.value === "formative") {
    x = ((target - S*wS)*(fT+futurePts) - F*wF*fT) / (wF*futurePts);
  } else {
    x = ((target - F*wF)*(sT+futurePts) - S*wS*sT) / (wS*futurePts);
  }

  if (x > 1) {
    const maxPossible =
      futureType.value === "summative"
        ? F * wF + 1.0 * wS
        : 1.0 * wF + S * wS;

    neededOutput.innerHTML = `
      ❌ <b>Impossible</b><br>
      Even with 100%, your maximum possible grade is
      <span style="color:#ffaa00;">
        ${(maxPossible * 100).toFixed(1)}%
      </span>
    `;
  } else if (x < 0) {
    neededOutput.innerHTML = `✅ You already exceeded your goal!`;
  } else {
    neededOutput.innerHTML =
      `🎯 You need ${(x*futurePts).toFixed(1)}/${futurePts}
       (${(x*100).toFixed(1)}%)`;
  }
};

targetSlider.oninput = () =>
  targetDisplay.textContent = targetSlider.value + "%";
</script>
</body>
</html>
